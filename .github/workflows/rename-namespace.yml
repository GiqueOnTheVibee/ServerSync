name: Rename namespace once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rename:
    if: github.event.head_commit.message == 'Prepare generic ServerSync namespace migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename Java namespace and Maven group
        shell: bash
        run: |
          set -euo pipefail

          # Replace package/import references and Maven group IDs.
          grep -RIl --exclude-dir=.git 'world\.marchoflegacy\.serversync' . \
            | xargs -r sed -i 's/world\.marchoflegacy\.serversync/dev.serversync/g'

          # Remove the project-specific author label from the Paper descriptor.
          if [ -f paper/src/main/resources/plugin.yml ]; then
            sed -i 's/authors: \[MarchOfLegacy\]/authors: [ServerSync]/g' paper/src/main/resources/plugin.yml
          fi

          # Move Java source directories so the filesystem matches dev.serversync.*.
          for module in common paper relay velocity; do
            old="$module/src/main/java/world/marchoflegacy/serversync"
            new="$module/src/main/java/dev/serversync"
            if [ -d "$old" ]; then
              mkdir -p "$(dirname "$new")"
              mv "$old" "$new"
              rm -rf "$module/src/main/java/world"
            fi
          done

          # This workflow is intentionally one-shot.
          rm -f .github/workflows/rename-namespace.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rename namespace to dev.serversync'
          git push origin main

name: Publish test build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-test-build.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build deployable jars
        run: mvn -B -ntp clean package
      - name: Prepare test2 files
        run: |
          mkdir -p dist
          cp paper/target/serversync-paper-0.1.0-SNAPSHOT.jar dist/ServerSync-Paper-0.1.0-test2.jar
          cp velocity/target/serversync-velocity-0.1.0-SNAPSHOT.jar dist/ServerSync-Velocity-0.1.0-test2.jar
          cp relay/target/serversync-relay-0.1.0-SNAPSHOT.jar dist/ServerSync-Relay-0.1.0-test2.jar
          sha256sum dist/*.jar > dist/SHA256SUMS.txt
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0-test2 \
            dist/ServerSync-Paper-0.1.0-test2.jar \
            dist/ServerSync-Velocity-0.1.0-test2.jar \
            dist/ServerSync-Relay-0.1.0-test2.jar \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ServerSync 0.1.0 test build 2" \
            --prerelease \
            --notes "Private experimental test build. Includes Paper/Purpur plugin, Velocity plugin and standalone Java 21 relay. Adds direct-first/optional-relay architecture primitives, latency-aware Shared Zone owner scoring, route selection, updated configuration and bundled common code in the Velocity JAR. Not production-ready."

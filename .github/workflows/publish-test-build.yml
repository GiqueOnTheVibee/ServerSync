name: Publish test build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-test-build.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build deployable jars
        run: mvn -B -ntp clean package
      - name: Prepare test7 files
        run: |
          mkdir -p dist relay-package
          cp paper/target/serversync-paper-0.1.0-SNAPSHOT.jar dist/ServerSync-Paper-0.1.0-test7.jar
          cp velocity/target/serversync-velocity-0.1.0-SNAPSHOT.jar dist/ServerSync-Velocity-0.1.0-test7.jar
          cp relay/target/serversync-relay-0.1.0-SNAPSHOT.jar dist/ServerSync-Relay-0.1.0-test7.jar
          cp dist/ServerSync-Relay-0.1.0-test7.jar relay-package/ServerSync-Relay-0.1.0-test7.jar
          cp relay/config.yml relay-package/config.yml
          cp relay/start.bat relay-package/start.bat
          (cd relay-package && zip -q -r ../dist/ServerSync-Relay-0.1.0-test7.zip .)
          sha256sum dist/*.jar dist/*.zip > dist/SHA256SUMS.txt
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0-test7 \
            dist/ServerSync-Paper-0.1.0-test7.jar \
            dist/ServerSync-Velocity-0.1.0-test7.jar \
            dist/ServerSync-Relay-0.1.0-test7.jar \
            dist/ServerSync-Relay-0.1.0-test7.zip \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ServerSync 0.1.0 test build 7" \
            --prerelease \
            --notes "Private experimental test build. First relay-authoritative map synchronization MVP: Paper block break/place intents are sent through exactly one authoritative relay, the relay assigns a monotonic per-Shared-Zone sequence and broadcasts an ordered block commit back to all nodes, and remote Paper nodes apply the committed BlockData. Adds deterministic preferred-relay selection, fail-closed block changes when world sync is enabled but no relay is connected, automatic config-default merging, world name mapping and /ssworldstatus diagnostics. All Paper nodes must start from the same world snapshot. This is not yet a production anti-dupe layer: source Bukkit events are still optimistic, relay sequences are in-memory, and containers/items/entities/redstone/fluids/durable event catch-up are not implemented yet."

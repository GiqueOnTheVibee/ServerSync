node-id: ro-1
region: eu
shared-zone-radius: 96

# ServerSync authentication root.
# velocity-secret: reuse Velocity's forwarding.secret. Copy the same file to this server if needed.
# dedicated-key: use a ServerSync-only secret file instead.
security:
  mode: velocity-secret
  secret-file: forwarding.secret

network:
  # direct-first: use node-to-node links normally; relay only when needed.
  # relay-only: force relay for debugging/compatibility.
  # peer-to-peer: never use relay; unsafe shared mutations must fail closed on partitions.
  mode: direct-first
  probes:
    interval-seconds: 5
    timeout-millis: 1500
  routing:
    relay-minimum-improvement-ms: 15.0
  owner-election:
    minimum-improvement-ms: 15.0
    candidate-hold-seconds: 10
    owner-cooldown-seconds: 30

# Packet-level remote player ghosts. PacketEvents 2.13.0 is required for rendering.
ghosts:
  enabled: true
  # 2 ticks = 10 player-state updates per second. Lower is smoother but sends more traffic.
  publish-interval-ticks: 2
  # Remove a remote ghost if its node stops sending state for this long.
  timeout-seconds: 10
  debug: false

  # Keep remote players visible in the vanilla client TAB list.
  tab-list:
    enabled: true
    # Supported placeholders: %player%, %node%
    # Example with node shown: "[%node%] %player%"
    format: "%player%"
    # Until real remote player ping is included in the ghost protocol, this is the displayed TAB ping.
    ping: 0

  # Test helper: lets you see a packet ghost of your own local player without a second server.
  # Keep disabled for normal multi-region use.
  debug-local-mirror:
    enabled: false
    offset-x: 2.0
    offset-z: 0.0

# First world synchronization stage.
# IMPORTANT: all Paper nodes must start from the same world snapshot before this is enabled.
# Block break/place changes are sent to exactly one authoritative relay. The relay assigns a per-zone
# sequence number and sends the ordered commit to every connected Paper node.
world-sync:
  enabled: false
  authoritative-relay: relay-1
  # Prevent new block changes when no authoritative relay is connected. Recommended once world-sync is enabled.
  fail-closed-when-relay-unavailable: true
  debug: false
  blocks:
    break: true
    place: true
    # Keep false for the MVP so applying a remote block does not start a second local physics chain.
    apply-physics: false
  # Remote world name -> local world name. Empty means identical world names on all nodes.
  world-map: {}

# Optional relay pool. You can add as many relay nodes as needed.
# 0.0.0.0 values below are placeholders for remote relay hosts; replace them before enabling.
relays:
  enabled: false
  connect-timeout-millis: 3000
  ping-interval-seconds: 5
  nodes:
    relay-1:
      enabled: true
      host: 0.0.0.0
      region: unknown
      gameplay-port: 25580
      voice-port: 25581
      capabilities:
        gameplay: true
        voice: true
        witness: true

    relay-2:
      enabled: false
      host: 0.0.0.0
      region: unknown
      gameplay-port: 25580
      voice-port: 25581
      capabilities:
        gameplay: true
        voice: true
        witness: true

redis:
  enabled: false
  # Placeholder address; replace it before enabling Redis.
  uri: redis://0.0.0.0:6379

voice:
  enabled: true
  public-host: ""
  forward-group-audio: false
  normal-distance: 48.0
  whisper-distance: 24.0
  world-map: {}
  relay:
    enabled: false
    # Preferred relay is tried first; other voice-capable relays are fallback candidates.
    preferred-relay: relay-1
    bind-port: 0
    heartbeat-seconds: 5
